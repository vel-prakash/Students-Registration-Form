<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 style="text-align: center;">Student Registration Form</h1>
    <label>Roll no :</label>
    <input type="text">
    <br><br>

    <label>Student name :</label>
    <input type="text" placeholder="First Name">
    -
    <input type="text" placeholder="Last Name">
    <br><br>

    <label>Father's name :</label>
    <input type="text">
    <br><br>

    <label>Date of birth :</label>
    <select>
        <option>Day</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
        <option>15</option>
        <option>16</option>
        <option>17</option>
        <option>18</option>
        <option>19</option>
        <option>20</option>
        <option>21</option>
        <option>22</option>
        <option>23</option>
        <option>24</option>
        <option>25</option>
        <option>26</option>
        <option>27</option>
        <option>28</option>
        <option>29</option>
        <option>30</option>
        <option>31</option>
    </select>

    <select>
        <option>Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
    </select>

    <select>
        <option>Year</option>
        <option>2000</option>
        <option>2001</option>
        <option>2002</option>
        <option>2003</option>
        <option>2004</option>
        <option>2005</option>
        <option>2006</option>
        <option>2007</option>
        <option>2008</option>
        <option>2009</option>
        <option>2010</option>
    </select>

    (DD-MM-YYYY)
    <br><br>

    <label>Mobile no. :</label>
    <input type="text" value="+91" size="2">
    -
    <input type="number">
    <br><br>

    <label>Email id :</label>
    <input type="email">
    <br><br>

    <label>Password :</label>
    <input type="password">
    <br><br>

    <label>Gender :</label>
    <input type="radio" name="gender">
    <label>Male</label>
    <input type="radio" name="gender">
    <label>Female</label>
    <br><br>

    Department :
    <input type="checkbox">
    <label>CSE</label>
    <input type="checkbox">
    <label>IT</label>
    <input type="checkbox">
    <label>ECE</label>
    <input type="checkbox">
    <label>CIVIL</label>
    <input type="checkbox">
    <label>MECH</label>
    <br><br>

    <label>Couse :</label>
    <select>
        <option>---------------- Select Current Course's ----------------</option>
        <option>CSE</option>
        <option>IT</option>
        <option>ECE</option>
        <option>Civil</option>
        <option>Mechanical</option>
    </select>
    <br><br>

    <label>Student photo :</label>
    <input type="file">
    <br><br>

    <label>City :</label>
    <input type="text">
    <br><br>

    <label>Address :</label>
    <br>
    <textarea></textarea>
</body>
</html>
